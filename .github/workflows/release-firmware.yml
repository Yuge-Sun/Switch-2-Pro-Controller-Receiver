name: Build firmware

on:
  push:
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/release-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.board }} firmware
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: DevKitC-1 N16R8
            artifact: esp32s3-receiver
            defaults: sdkconfig.defaults
          - board: Mini ESP32-S3FH4R2
            artifact: esp32s3-mini-receiver
            defaults: sdkconfig.defaults;sdkconfig.defaults.mini
    steps:
      - uses: actions/checkout@v4
      - name: Build and merge the receiver image
        working-directory: firmware
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          SDK_DEFAULTS: ${{ matrix.defaults }}
        run: |
          set -eo pipefail
          . "$IDF_PATH/export.sh"
          idf.py -D "SDKCONFIG_DEFAULTS=$SDK_DEFAULTS" build
          mkdir -p dist
          cd build
          python -m esptool --chip esp32s3 merge_bin -o "../dist/$ARTIFACT.bin" @flash_args
          cd ../dist
          sha256sum "$ARTIFACT.bin" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            firmware/dist/${{ matrix.artifact }}.bin
            firmware/dist/SHA256SUMS.txt
          if-no-files-found: error
