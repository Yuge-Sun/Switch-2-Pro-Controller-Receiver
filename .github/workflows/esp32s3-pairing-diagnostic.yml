name: ESP32-S3 PS5 pairing diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Test complete pairing exchange in both source trees
        shell: bash
        run: bash tools/tests/run_switch2_pairing_tests.sh
      - name: Build PS5 pairing diagnostic for 16 MB ESP32-S3
        working-directory: source/final-three-in-one/firmware/esp32s3_dualsense_identity_experiment
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -D V5_5_DS5_PROFILE=hid_audio_uac1_4ch_dualsense -D PRO2_PAIRING_DIAGNOSTICS=ON set-target esp32s3
          idf.py -D V5_5_DS5_PROFILE=hid_audio_uac1_4ch_dualsense -D PRO2_PAIRING_DIAGNOSTICS=ON build
          cd build
          python -m esptool --chip esp32s3 merge_bin -o ps5-pairing-diagnostic.bin @flash_args
          cp esp32s3_dualsense_identity_experiment.bin ps5-pairing-diagnostic-app.bin
          sha256sum ps5-pairing-diagnostic*.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-ps5-pairing-diagnostic
          path: |
            source/final-three-in-one/firmware/esp32s3_dualsense_identity_experiment/build/ps5-pairing-diagnostic*.bin
            source/final-three-in-one/firmware/esp32s3_dualsense_identity_experiment/build/flasher_args.json
            source/final-three-in-one/firmware/esp32s3_dualsense_identity_experiment/build/SHA256SUMS.txt
          if-no-files-found: error
